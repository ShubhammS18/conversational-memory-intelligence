[build-system]
requires = ["setuptools>=77,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "conversational-memory-intelligence"
version = "0.1.0"
description = "A local, reusable conversational memory layer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faiss-cpu>=1.15,<2",
  "numpy>=1.26,<3",
  "pydantic>=2,<3",
  "sentence-transformers>=5,<6",
  "tiktoken>=0.13,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["conversational_memory*"]

[tool.setuptools.package-data]
"conversational_memory.infrastructure.sqlite" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real_model: requires the approved cached immutable SentenceTransformer model",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["conversational_memory"]
